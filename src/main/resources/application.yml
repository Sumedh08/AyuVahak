spring:
  application:
    name: ayuvahak
  datasource:
    url: ${ayuvahak.database.url}
    username: ${ayuvahak.database.username}
    password: ${ayuvahak.database.password}
    hikari:
      maximum-pool-size: ${AYUVAHAK_DATABASE_POOL_MAX_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
    prometheus:
      access: read-only
  tracing:
    export:
      otlp:
        enabled: ${AYUVAHAK_OTLP_TRACING_ENABLED:false}
logging:
  structured:
    format:
      console: logstash

ayuvahak:
  database:
    url: ${AYUVAHAK_DATABASE_URL:}
    username: ${AYUVAHAK_DATABASE_USERNAME:}
    password: ${AYUVAHAK_DATABASE_PASSWORD:}
  platform:
    service-name: AyuVahak
  authentication:
    issuer: ${AYUVAHAK_OIDC_ISSUER:}
    jwk-set-uri: ${AYUVAHAK_OIDC_JWK_SET_URI:}
    audience: ${AYUVAHAK_OIDC_AUDIENCE:}
    service-client-ids: ${AYUVAHAK_OIDC_SERVICE_CLIENT_IDS:}
    allow-http: ${AYUVAHAK_OIDC_ALLOW_HTTP:false}
