spring:
  application:
    name: ayuvahak
  profiles:
    group:
      production-single-site:
        - production
      production-ha:
        - production
  jdbc:
    template:
      query-timeout: 30s
  datasource:
    url: ${ayuvahak.database.url}
    username: ${ayuvahak.database.username}
    password: ${ayuvahak.database.password}
    hikari:
      maximum-pool-size: ${AYUVAHAK_DATABASE_POOL_MAX_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,retentionReapplication
    prometheus:
      access: read-only
  tracing:
    export:
      otlp:
        enabled: ${AYUVAHAK_OTLP_TRACING_ENABLED:false}
logging:
  structured:
    format:
      console: logstash

ayuvahak:
  retention:
    reapplication:
      required-restore-id: ${AYUVAHAK_RETENTION_REQUIRED_RESTORE_ID:}
  database:
    url: ${AYUVAHAK_DATABASE_URL:}
    username: ${AYUVAHAK_DATABASE_USERNAME:}
    password: ${AYUVAHAK_DATABASE_PASSWORD:}
  platform:
    service-name: AyuVahak
  exchange:
    egress:
      allowed-ports:
        - 443
      allowed-private-networks-by-partner: {}
  directory:
    mcsd:
      source-bindings: []
      facility-location-types: []
      ordered-last-updated-profiles: []
  authentication:
    issuer: ${AYUVAHAK_OIDC_ISSUER:}
    jwk-set-uri: ${AYUVAHAK_OIDC_JWK_SET_URI:}
    audience: ${AYUVAHAK_OIDC_AUDIENCE:}
    service-client-ids: ${AYUVAHAK_OIDC_SERVICE_CLIENT_IDS:}
    allow-http: ${AYUVAHAK_OIDC_ALLOW_HTTP:false}
  matching:
    owner-read-client-id: ${AYUVAHAK_MATCHING_OWNER_READ_CLIENT_ID:ayuvahak-matching-owner-read}
    policy:
      active: ${AYUVAHAK_MATCHING_POLICY_ACTIVE:false}
  referral:
    ips:
      source-bindings: []
    transfer-amendment-check-client-id: ${AYUVAHAK_REFERRAL_TRANSFER_AMENDMENT_CHECK_CLIENT_ID:ayuvahak-transfer-amendment-guard}
  transfer:
    expiry-worker-client-id: ${AYUVAHAK_TRANSFER_EXPIRY_CLIENT_ID:ayuvahak-transfer-expiry-worker}
    expiry-polling-enabled: ${AYUVAHAK_TRANSFER_EXPIRY_POLLING_ENABLED:true}
    expiry-poll-interval: ${AYUVAHAK_TRANSFER_EXPIRY_POLL_INTERVAL:PT15S}
    expiry-batch-size: ${AYUVAHAK_TRANSFER_EXPIRY_BATCH_SIZE:50}
  analytics:
    correction-window: ${AYUVAHAK_ANALYTICS_CORRECTION_WINDOW:PT720H}
  operator-support:
    enabled: ${AYUVAHAK_OPERATOR_SUPPORT_ENABLED:false}
    provider: ${AYUVAHAK_OPERATOR_SUPPORT_PROVIDER:DETERMINISTIC_LOCAL}
    endpoint: ${AYUVAHAK_OPERATOR_SUPPORT_ENDPOINT:}
    model: ${AYUVAHAK_OPERATOR_SUPPORT_MODEL:}
    provider-profile-revision: ${AYUVAHAK_OPERATOR_SUPPORT_PROVIDER_PROFILE_REVISION:}
    secret-reference: ${AYUVAHAK_OPERATOR_SUPPORT_SECRET_REFERENCE:}
    evaluated-profile-fingerprint: ${AYUVAHAK_OPERATOR_SUPPORT_EVALUATED_PROFILE_FINGERPRINT:}
    allowed-hosts: ${AYUVAHAK_OPERATOR_SUPPORT_ALLOWED_HOSTS:}
    timeout: ${AYUVAHAK_OPERATOR_SUPPORT_TIMEOUT:PT8S}
    max-response-bytes: ${AYUVAHAK_OPERATOR_SUPPORT_MAX_RESPONSE_BYTES:16384}
    use-case: ${AYUVAHAK_OPERATOR_SUPPORT_USE_CASE:UNASSESSED}
    allowed-data-class: ${AYUVAHAK_OPERATOR_SUPPORT_ALLOWED_DATA_CLASS:UNASSESSED}
    provider-retention-disposition: ${AYUVAHAK_OPERATOR_SUPPORT_RETENTION_DISPOSITION:UNASSESSED}
    provider-training-use: ${AYUVAHAK_OPERATOR_SUPPORT_TRAINING_USE:UNASSESSED}
    processing-jurisdiction: ${AYUVAHAK_OPERATOR_SUPPORT_PROCESSING_JURISDICTION:}
    provider-monthly-spend-cap: ${AYUVAHAK_OPERATOR_SUPPORT_MONTHLY_SPEND_CAP:}
    provider-monthly-spend-cap-currency: ${AYUVAHAK_OPERATOR_SUPPORT_MONTHLY_SPEND_CAP_CURRENCY:}
    provider-spend-cap-enforced: ${AYUVAHAK_OPERATOR_SUPPORT_SPEND_CAP_ENFORCED:false}
    provider-spend-cap-control-reference: ${AYUVAHAK_OPERATOR_SUPPORT_SPEND_CAP_CONTROL_REFERENCE:}
  eventing:
    outbox:
      delivered-event-retention: ${AYUVAHAK_OUTBOX_DELIVERED_EVENT_RETENTION:}
  idempotency:
    receipt-lock-wait: ${AYUVAHAK_IDEMPOTENCY_RECEIPT_LOCK_WAIT:PT5S}
