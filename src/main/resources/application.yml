spring:
  application:
    name: ayuvahak
  jdbc:
    template:
      query-timeout: 30s
  datasource:
    url: ${ayuvahak.database.url}
    username: ${ayuvahak.database.username}
    password: ${ayuvahak.database.password}
    hikari:
      maximum-pool-size: ${AYUVAHAK_DATABASE_POOL_MAX_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
    prometheus:
      access: read-only
  tracing:
    export:
      otlp:
        enabled: ${AYUVAHAK_OTLP_TRACING_ENABLED:false}
logging:
  structured:
    format:
      console: logstash

ayuvahak:
  database:
    url: ${AYUVAHAK_DATABASE_URL:}
    username: ${AYUVAHAK_DATABASE_USERNAME:}
    password: ${AYUVAHAK_DATABASE_PASSWORD:}
  platform:
    service-name: AyuVahak
  exchange:
    egress:
      allowed-ports:
        - 443
      allowed-private-networks-by-partner: {}
  directory:
    mcsd:
      source-bindings: []
      facility-location-types: []
      ordered-last-updated-profiles: []
  authentication:
    issuer: ${AYUVAHAK_OIDC_ISSUER:}
    jwk-set-uri: ${AYUVAHAK_OIDC_JWK_SET_URI:}
    audience: ${AYUVAHAK_OIDC_AUDIENCE:}
    service-client-ids: ${AYUVAHAK_OIDC_SERVICE_CLIENT_IDS:}
    allow-http: ${AYUVAHAK_OIDC_ALLOW_HTTP:false}
  matching:
    owner-read-client-id: ${AYUVAHAK_MATCHING_OWNER_READ_CLIENT_ID:ayuvahak-matching-owner-read}
    policy:
      active: ${AYUVAHAK_MATCHING_POLICY_ACTIVE:false}
  referral:
    ips:
      source-bindings: []
    transfer-amendment-check-client-id: ${AYUVAHAK_REFERRAL_TRANSFER_AMENDMENT_CHECK_CLIENT_ID:ayuvahak-transfer-amendment-guard}
  transfer:
    expiry-worker-client-id: ${AYUVAHAK_TRANSFER_EXPIRY_CLIENT_ID:ayuvahak-transfer-expiry-worker}
    expiry-polling-enabled: ${AYUVAHAK_TRANSFER_EXPIRY_POLLING_ENABLED:true}
    expiry-poll-interval: ${AYUVAHAK_TRANSFER_EXPIRY_POLL_INTERVAL:PT15S}
    expiry-batch-size: ${AYUVAHAK_TRANSFER_EXPIRY_BATCH_SIZE:50}
  analytics:
    correction-window: ${AYUVAHAK_ANALYTICS_CORRECTION_WINDOW:PT720H}
  eventing:
    outbox:
      delivered-event-retention: ${AYUVAHAK_OUTBOX_DELIVERED_EVENT_RETENTION:}
  idempotency:
    receipt-lock-wait: ${AYUVAHAK_IDEMPOTENCY_RECEIPT_LOCK_WAIT:PT5S}
