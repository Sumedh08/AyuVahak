# Spring integration tests exercise the normal empty deployment unless a test explicitly selects
# Synthetic Demo. Production and local startup must provide their deployment mode explicitly.
ayuvahak.deployment.mode=EMPTY
# Tests drive durable dispatch through OutboxDispatcher directly. Disabling the scheduled
# polling worker keeps Testcontainers lifecycle deterministic and prevents stale-context polling.
ayuvahak.eventing.outbox.dispatcher-enabled=false
ayuvahak.eventing.outbox.delivered-event-retention=PT720H
# Tests invoke expiry, reservation recovery, and Capacity lifecycle operations directly. Keep
# their production schedulers inactive so cached Spring contexts never poll stopped test databases.
ayuvahak.transfer.expiry-polling-enabled=false
ayuvahak.transfer.reservation-polling-enabled=false
ayuvahak.capacity.reservation-lifecycle.enabled=false
