name: AyuVahak full verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: React and TypeScript verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Verify frontend
        working-directory: ui
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

  verify:
    name: Java 25 and PostgreSQL/PostGIS verification
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run the complete local verification gate
        run: ./mvnw -B -ntp clean verify
