services:
  app:
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: "optional:file:/run/ayuvahak-demo-config.yml"
    volumes:
      - ./.local-state/demo-application.yml:/run/ayuvahak-demo-config.yml:ro
  keycloak:
    volumes:
      - ./.local-state/keycloak-realm-import.json:/opt/keycloak/data/import/ayuvahak-realm.json:ro
