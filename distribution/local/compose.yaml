services:
  database:
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    environment:
      POSTGRES_DB: "${AYUVAHAK_DATABASE_NAME:?Copy .env.example to .env first}"
      POSTGRES_USER: "${AYUVAHAK_DATABASE_USERNAME:?Copy .env.example to .env first}"
      POSTGRES_PASSWORD: "${AYUVAHAK_DATABASE_PASSWORD:?Start the local launcher first}"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${AYUVAHAK_KEYCLOAK_ADMIN_USERNAME:?Start the local launcher first}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${AYUVAHAK_KEYCLOAK_ADMIN_PASSWORD:?Start the local launcher first}"
      KC_HOSTNAME: "http://localhost:${AYUVAHAK_KEYCLOAK_PORT:-8081}"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./.local-state/keycloak-realm-import.json:/opt/keycloak/data/import/ayuvahak-realm.json:ro
    ports:
      - "127.0.0.1:${AYUVAHAK_KEYCLOAK_PORT:-8081}:8080"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      AYUVAHAK_DATABASE_URL: "jdbc:postgresql://database:5432/${AYUVAHAK_DATABASE_NAME:?Copy .env.example to .env first}"
      AYUVAHAK_DATABASE_USERNAME: "${AYUVAHAK_DATABASE_USERNAME:?Copy .env.example to .env first}"
      AYUVAHAK_DATABASE_PASSWORD: "${AYUVAHAK_DATABASE_PASSWORD:?Start the local launcher first}"
      AYUVAHAK_OIDC_ISSUER: "${AYUVAHAK_OIDC_ISSUER:?Copy .env.example to .env first}"
      AYUVAHAK_OIDC_JWK_SET_URI: "${AYUVAHAK_OIDC_JWK_SET_URI:?Copy .env.example to .env first}"
      AYUVAHAK_OIDC_AUDIENCE: "${AYUVAHAK_OIDC_AUDIENCE:?Copy .env.example to .env first}"
      AYUVAHAK_OIDC_SERVICE_CLIENT_IDS: "${AYUVAHAK_OIDC_SERVICE_CLIENT_IDS:?Copy .env.example to .env first}"
      AYUVAHAK_OIDC_ALLOW_HTTP: "${AYUVAHAK_OIDC_ALLOW_HTTP:-false}"
      AYUVAHAK_DEPLOYMENT_MODE: "${AYUVAHAK_DEPLOYMENT_MODE:?Choose Synthetic Demo or Empty with Start-AyuVahak.ps1}"
      AYUVAHAK_OUTBOX_DELIVERED_EVENT_RETENTION: "${AYUVAHAK_OUTBOX_DELIVERED_EVENT_RETENTION:?Copy .env.example to .env first}"
      AYUVAHAK_IDEMPOTENCY_RECEIPT_LOCK_WAIT: "${AYUVAHAK_IDEMPOTENCY_RECEIPT_LOCK_WAIT:-PT5S}"
      AYUVAHAK_OPERATOR_SUPPORT_ENABLED: "${AYUVAHAK_OPERATOR_SUPPORT_ENABLED:-false}"
      AYUVAHAK_OPERATOR_SUPPORT_PROVIDER: "${AYUVAHAK_OPERATOR_SUPPORT_PROVIDER:-DETERMINISTIC_LOCAL}"
      AYUVAHAK_OPERATOR_SUPPORT_ENDPOINT: "${AYUVAHAK_OPERATOR_SUPPORT_ENDPOINT:-}"
      AYUVAHAK_OPERATOR_SUPPORT_MODEL: "${AYUVAHAK_OPERATOR_SUPPORT_MODEL:-}"
      AYUVAHAK_OPERATOR_SUPPORT_SECRET_REFERENCE: "${AYUVAHAK_OPERATOR_SUPPORT_SECRET_REFERENCE:-}"
      AYUVAHAK_OPERATOR_SUPPORT_ALLOWED_HOSTS: "${AYUVAHAK_OPERATOR_SUPPORT_ALLOWED_HOSTS:-}"
      AYUVAHAK_OPERATOR_SUPPORT_TIMEOUT: "${AYUVAHAK_OPERATOR_SUPPORT_TIMEOUT:-PT8S}"
      AYUVAHAK_OPERATOR_SUPPORT_MAX_RESPONSE_BYTES: "${AYUVAHAK_OPERATOR_SUPPORT_MAX_RESPONSE_BYTES:-16384}"
      AYUVAHAK_OPERATOR_SUPPORT_API_KEY: "${AYUVAHAK_OPERATOR_SUPPORT_API_KEY:-}"
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: "file:/tmp/,file:/app/web/"
    volumes:
      - ./.local-state/ui-runtime-config.js:/tmp/runtime-config.js:ro
    ports:
      - "127.0.0.1:${AYUVAHAK_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    stop_grace_period: 30s

volumes:
  postgres-data:
  keycloak-data:
